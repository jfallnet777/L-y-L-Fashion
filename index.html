function totalesEstado(E){
  const sub=E.L.reduce((s,l)=>s+num(l.cantidad)*num(l.precio),0), x=num(E.desc);
  const desc=Math.min(sub, E.dtipo==="pct" ? Math.round(sub*Math.min(100,x))/100 : x);
  return {sub, desc, total:sub-desc};
}
async function registrarPedido(E){
  const ls=E.L, t=totalesEstado(E), pid=ls.length>1?"p"+nuevoId():null, aid=nuevoId(), fecha=E.fecha||hoy(), cliente=E.cliente;
  let descRest=t.desc, pagoRest=Math.min(num(E.abono), t.total); const ids=[];
  for(let i=0;i<ls.length;i++){ const l=ls[i], it=NEG.items.find(x=>x.id===l.productoId), bruto=num(l.cantidad)*num(l.precio), ultima=i===ls.length-1;
    const d = ultima ? Math.round(descRest*100)/100 : (t.sub?Math.round(t.desc*bruto/t.sub*100)/100:0); descRest-=d;
    const neto=bruto-d, parte = ultima ? Math.round(pagoRest*100)/100 : Math.min(pagoRest, Math.round((t.total?num(E.abono)*neto/t.total:0)*100)/100); pagoRest-=parte;
    const r=await NEG.ven.add({productoId:it.id, producto:it.nombre, costo:num(it.costo), precio:num(l.precio), cantidad:num(l.cantidad), cliente, fecha,
      descuento:d, descPct:E.dtipo==="pct"&&num(E.desc)>0?num(E.desc):null, abonos:parte>0?[{id:aid,monto:parte,fecha}]:[], devoluciones:[],
      creado:Date.now()+i, ...(pid?{pedido:pid}:{})});
    ids.push(r&&r.id); }
  return ids;
}
function docDeEstado(E, numero){
  const t=totalesEstado(E), pagado=Math.min(num(E.abono), t.total), p=perfilDe(claveCliente(E.cliente))||{};
  return {tipo:"ticket", titulo:"Ticket de venta", numero, fecha:E.fecha||hoy(), cliente:E.cliente, telefono:p.telefono||"",
    lineas:E.L.map(l=>{ const it=NEG.items.find(x=>x.id===l.productoId)||{}; return {nombre:it.nombre||"", cant:num(l.cantidad), precio:num(l.precio), total:num(l.cantidad)*num(l.precio)}; }),
    subtotal:t.sub, descuento:t.desc, devol:0, total:t.total, pagado, saldo:Math.max(0,t.total-pagado), aFavor:Math.max(0,num(E.abono)-t.total), pie:"¡Gracias por tu compra!"};
}

const ICO_CAJA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M3.5 7.5 12 3.5l8.5 4v9L12 20.5l-8.5-4z"/><path d="M3.5 7.5 12 11.5l8.5-4M12 11.5v9M7.8 5.5l8.5 4"/></svg>';
const cajasOrden = () => NEG.cajas.slice().sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creado||0)-(a.creado||0));
const cajaDe = it => it && it.cajaId ? NEG.cajas.find(c=>c.id===it.cajaId) || null : null;
const nombreCaja = it => { const c=cajaDe(it); return c ? c.nombre : ""; };
const itemsDeCaja = id => NEG.items.filter(i=>i.cajaId===id);

function statsCaja(c){
  const its=itemsDeCaja(c.id); let piezas=0,quedanP=0,costoProd=0,vendido=0,ganado=0,posible=0,valorRest=0;
  for(const i of its){ const co=num(i.costo), q=Math.max(0,quedan(i));
    piezas+=num(i.cantidad); quedanP+=q; costoProd+=co*num(i.cantidad); posible+=q*(num(i.precio)-co); valorRest+=q*num(i.precio);
    for(const v of NEG.ventas) if(v.productoId===i.id){ vendido+=totalV(v); ganado+=gananciaV(v); } }
  const pagado = num(c.costo) > 0 ? num(c.costo) : costoProd;
  return {its, piezas, quedan:quedanP, vendidas:Math.max(0,piezas-quedanP), costoProd, pagado, vendido, ganado, posible, valorRest,
    falta:Math.max(0,pagado-vendido), pct: pagado>0 ? Math.min(100,Math.round(vendido/pagado*100)) : 0};
}

/* Repartir el costo total de la caja entre sus piezas */
function repartirCosto(cajaId){
  const c=NEG.cajas.find(x=>x.id===cajaId); if(!c) return;
  const its=itemsDeCaja(cajaId), total=num(c.costo), piezas=its.reduce((s,i)=>s+num(i.cantidad),0), valor=its.reduce((s,i)=>s+num(i.cantidad)*num(i.precio),0);
  const redondo = n => Math.round(n);
  const calc = modo => its.map(i=>({i, costo: modo==="precio" ? (valor>0 ? redondo(total*num(i.precio)/valor) : 0) : (piezas>0 ? redondo(total/piezas) : 0)}));
  abrirHoja(`<div class="form"><h2>Repartir el costo</h2>
    <p>Pagaste <b>${dinero(total)}</b> por «${esc(c.nombre)}», que trajo ${piezas} ${piezas===1?"pieza":"piezas"}. Elige cómo repartirlo y la app pone el costo de cada producto.</p>
    <label class="delopt"><input type="radio" name="rmodo" value="precio" checked><span><b>Según el precio de venta</b><small>Lo que vendes más caro carga más costo. Recomendado si la caja trae cosas de precios distintos.</small></span></label>
    <label class="delopt"><input type="radio" name="rmodo" value="igual"><span><b>Igual para cada pieza</b><small>${piezas?`Cada pieza costaría ${dinero(redondo(total/piezas))}.`:""}</small></span></label>
    <div class="rows" id="rprev"></div>
    <p class="hint" id="hint"></p>
    <button class="btn block" id="rok" ${piezas?"":"disabled"}>Poner estos costos</button>
    <button class="btn ghost block" id="rno" style="margin-top:8px">Cancelar</button></div>`, ()=>{
    const modo=()=>(document.querySelector("[name=rmodo]:checked")||{}).value||"precio";
    const pintar=()=>{ $("#rprev").innerHTML=calc(modo()).map(({i,costo})=>`<div class="abitem"><span>${esc(i.nombre)} <small class="note">· ${num(i.cantidad)} × </small></span><b>${dinero(costo)} c/u <small class="note">(antes ${dinero(num(i.costo))})</small></b></div>`).join("")
      + (valor<=0&&modo()==="precio"?`<p class="hint">Tus productos no tienen precio de venta. Usa «Igual para cada pieza».</p>`:""); };
    sheet.querySelectorAll("[name=rmodo]").forEach(r=>r.onchange=pintar); pintar();
    $("#rno").onclick=()=>hojaCaja(cajaId);
    $("#rok").onclick=async()=>{ if(modo()==="precio"&&valor<=0) return; const b=$("#rok"); b.disabled=true;

        avisar("Costos actualizados"); hojaCaja(cajaId);

  });
}

  abrirHoja(`<div class="form"><h2>¿A qué caja van?</h2>
    <p>${its.length} ${its.length===1?"producto seleccionado":"productos seleccionados"}.</p>
    <div class="rows">${cajasOrden().map(c=>`<button class="rowi withpic" data-mvcaja="${c.id}"><span class="thumb ph cjtile" style="width:40px;height:40px" aria-hidden="true">${ICO_CAJA}</span><span class="t">${esc(c.nombre)}</span><span class="v"></span><span class="s">${itemsDeCaja(c.id).length} ${itemsDeCaja(c.id).length===1?"producto":"productos"}</span></button>`).join("")}</div>
    <label class="field" style="margin-top:12px">O crea una caja nueva<span class="cjnew"><input id="mvnom" placeholder="Nombre de la caja"><button class="btn sm" id="mvcrear">Crear</button></span></label>
    ${its.some(i=>cajaDe(i))?`<button class="btn ghost block" data-mvcaja="" style="margin-top:6px">Sacarlos de su caja</button>`:""}
    <p class="hint" id="hint"></p></div>`, ()=>{
    const mover=async cid=>{ try{ for(const i of its){ const {id,...rest}=i; await NEG.inv.doc(id).set({...rest,cajaId:cid}); }
        salirSeleccion(); avisar(cid?"Productos guardados en la caja":"Productos sacados de la caja"); if(cid){ hojaCaja(cid); } else sheet.close();
      }catch(e){ errorGuardar(e); } };
    sheet.querySelectorAll("[data-mvcaja]").forEach(b=>b.onclick=()=>{ b.disabled=true; mover(b.dataset.mvcaja); });
    $("#mvcrear").onclick=async e=>{ e.preventDefault(); const n=$("#mvnom").value.trim(); if(!n){ $("#hint").textContent="Escribe el nombre de la caja."; return; }
      e.target.disabled=true; try{ mover(await idCajaPorNombre(n)); }catch(err){ e.target.disabled=false; errorGuardar(err); } };
  });
}

view.addEventListener("click", e=>{
  const s=e.target.closest("[data-iseg]"); if(s){ if(typeof salirSeleccion==="function") salirSeleccion(); NEG.iseg=s.dataset.iseg; return vistaNegocio(); }
  if(e.target.closest("[data-nueva-caja]")) return formCaja();
  const c=e.target.closest("[data-caja]"); if(c) return hojaCaja(c.dataset.caja);
});
document.addEventListener("click", e=>{
  if(e.target.closest("[data-sel-caja]")){ const ids=[...SEL.ids].map(k=>k.slice(2)); moverSeleccionACaja(ids); }
});

/* ============ Selección múltiple para eliminar (mantener presionado) ============ */
const SEL = { activo:false, tipo:"", ids:new Set(), timer:null, x:0, y:0, recien:false };
function tipoSeleccion(){
  if(NEG.sub==="ventas" && NEG.vseg==="ventas") return "ventas";
  if(NEG.sub==="clientes") return "clientes";
  if(NEG.sub==="inventario" && NEG.iseg!=="cajas") return "inventario";
  return "";
}
function claveFila(row){
  if(row.dataset.venta) return "v:"+row.dataset.venta;
  if(row.dataset.pedido) return "p:"+row.dataset.pedido;
  if(row.dataset.cliente) return "c:"+row.dataset.cliente;
  if(row.dataset.item) return "i:"+row.dataset.item;
  return "";
}
const filaSeleccionable = el => { const t=tipoSeleccion(); if(!t) return null;
  const r=el.closest(".rows > .rowi"); if(!r || !view.contains(r)) return null;
  if(t==="ventas" && (r.dataset.venta||r.dataset.pedido)) return r;
  if(t==="clientes" && r.dataset.cliente) return r;
  if(t==="inventario" && r.dataset.item) return r;
  return null; };
function entrarSeleccion(row){
  SEL.activo=true; SEL.tipo=tipoSeleccion(); SEL.ids=new Set([claveFila(row)]);
  if(navigator.vibrate) try{ navigator.vibrate(18); }catch(e){}
  document.body.classList.add("seleccionando"); marcarSeleccion();
}
function salirSeleccion(){ SEL.activo=false; SEL.ids.clear(); document.body.classList.remove("seleccionando"); marcarSeleccion(); }
function marcarSeleccion(){
  const bar=$("#selbar"); if(!bar) return;
  if(SEL.activo && SEL.tipo!==tipoSeleccion()) { SEL.activo=false; SEL.ids.clear(); document.body.classList.remove("seleccionando"); }
  view.querySelectorAll(".rows > .rowi").forEach(r=>{ const k=claveFila(r), on=SEL.activo && SEL.ids.has(k);
    r.classList.toggle("sel-on",on); r.classList.toggle("sel-modo",SEL.activo && !!filaSeleccionable(r));
    let ck=r.querySelector(".selck"); if(SEL.activo && filaSeleccionable(r)){ if(!ck){ ck=document.createElement("i"); ck.className="selck"; ck.setAttribute("aria-hidden","true"); ck.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'; r.appendChild(ck); } r.setAttribute("aria-pressed",String(on)); }
    else { if(ck) ck.remove(); r.removeAttribute("aria-pressed"); } });
  const n=SEL.ids.size, nom={ventas:["venta","ventas"],clientes:["cliente","clientes"],inventario:["producto","productos"]}[SEL.tipo]||["",""];
  bar.hidden=!SEL.activo; bar.classList.toggle("concaja",SEL.tipo==="inventario");
  if(SEL.activo) bar.innerHTML=`<button class="sb-x" data-sel-salir aria-label="Cancelar selección"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <b>${n} ${n===1?nom[0]:nom[1]}</b>
    <button class="sb-todo" data-sel-todo>Todo</button>
    ${SEL.tipo==="inventario"?`<button class="sb-caja" data-sel-caja ${n?"":"disabled"}>${ICO_CAJA}<span>Caja</span></button>`:""}
    <button class="sb-del" data-sel-borrar ${n?"":"disabled"}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Eliminar</button>`;
}
// mantener presionado
view.addEventListener("pointerdown",e=>{ SEL.recien=false; if(e.button>0) return; const r=filaSeleccionable(e.target); if(!r || SEL.activo) return;
  SEL.x=e.clientX; SEL.y=e.clientY; clearTimeout(SEL.timer);
  SEL.timer=setTimeout(()=>{ SEL.recien=true; entrarSeleccion(r); setTimeout(()=>{ SEL.recien=false; },800); },520); });
["pointerup","pointercancel","pointerleave"].forEach(ev=>view.addEventListener(ev,()=>clearTimeout(SEL.timer)));
view.addEventListener("pointermove",e=>{ if(Math.abs(e.clientX-SEL.x)>10 || Math.abs(e.clientY-SEL.y)>10) clearTimeout(SEL.timer); });
window.addEventListener("scroll",()=>clearTimeout(SEL.timer),{passive:true});
view.addEventListener("contextmenu",e=>{ const r=filaSeleccionable(e.target); if(!r) return; e.preventDefault(); clearTimeout(SEL.timer);
  if(!SEL.activo){ SEL.recien=false; entrarSeleccion(r); } });
// toques en modo selección (antes que los demás manejadores)
view.addEventListener("click",e=>{
  if(SEL.recien){ SEL.recien=false; if(filaSeleccionable(e.target)){ e.preventDefault(); e.stopImmediatePropagation(); return; } }
  if(!SEL.activo) return;
  const r=filaSeleccionable(e.target);
  if(r){ e.preventDefault(); e.stopImmediatePropagation(); const k=claveFila(r); SEL.ids.has(k)?SEL.ids.delete(k):SEL.ids.add(k); marcarSeleccion(); return; }
  if(e.target.closest("[data-vseg],[data-seg],[data-nueva-venta],[data-nuevo-item],[data-nuevo-cliente],[data-pedido],[data-venta],[data-cliente],[data-item]")){ salirSeleccion(); }
}, true);
document.addEventListener("click",e=>{
  if(e.target.closest("[data-sel-salir]")) return salirSeleccion();
  if(e.target.closest("[data-sel-todo]")){ const filas=[...view.querySelectorAll(".rows > .rowi")].filter(r=>filaSeleccionable(r)).map(claveFila);
    const todas=filas.every(k=>SEL.ids.has(k)); SEL.ids = todas ? new Set() : new Set(filas); return marcarSeleccion(); }
  if(e.target.closest("[data-sel-borrar]")) return confirmarBorradoMultiple();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && SEL.activo && !sheet.open) salirSeleccion(); });
window.addEventListener("hashchange",()=>{ if(SEL.activo) salirSeleccion(); });

function confirmarBorradoMultiple(){
  const ids=[...SEL.ids], tipo=SEL.tipo; if(!ids.length) return;
  let titulo, detalle="", lista=[], tareas=[], tareasConservar=null, conOpciones=false;
  if(tipo==="ventas"){
    const vs=[]; ids.forEach(k=>{ const [t,id]=[k[0],k.slice(2)]; if(t==="v"){ const v=NEG.ventas.find(x=>x.id===id); if(v) vs.push(v); } else lineasPedido(id).forEach(v=>vs.push(v)); });
    titulo=`¿Eliminar ${ids.length} ${ids.length===1?"venta":"ventas"}?`;
    detalle=`Total de lo que se borra: <b>${dinero(vs.reduce((s,v)=>s+totalV(v),0))}</b>. Las piezas vuelven a tu inventario y los abonos de estas ventas también se borran.`;
    lista=ids.map(k=>{ if(k[0]==="p"){ const ls=lineasPedido(k.slice(2)); return `${ls[0]?esc(ls[0].cliente):""} · ${ls.length} productos`; } const v=NEG.ventas.find(x=>x.id===k.slice(2)); return v?`${esc(v.cliente)} · ${esc(v.producto)}`:""; });
    tareas=vs.map(v=>()=>NEG.ven.doc(v.id).delete());
  } else if(tipo==="clientes"){
    const ks=ids.map(k=>k.slice(2)), vs=NEG.ventas.filter(v=>ks.includes(claveCliente(v.cliente))), qs=NEG.cotizaciones.filter(c=>ks.includes(claveCliente(c.cliente))), ps=NEG.perfiles.filter(p=>ks.includes(claveCliente(p.nombre)));
    const nAb=vs.reduce((s,v)=>s+abonosDe(v).length,0), nDev=vs.reduce((s,v)=>s+devDe(v).length,0);
    titulo=`¿Eliminar ${ks.length} ${ks.length===1?"cliente":"clientes"}?`;
    conOpciones = vs.length>0 || qs.length>0;
    detalle = conOpciones ? `${ks.length===1?"Este cliente tiene":"Estos clientes tienen"} ${vs.length} ${vs.length===1?"venta":"ventas"}, ${nAb} ${nAb===1?"abono":"abonos"} y ${nDev} ${nDev===1?"devolución":"devoluciones"}${qs.length?`, y ${qs.length} ${qs.length===1?"cotización":"cotizaciones"}`:""}. ¿Qué quieres hacer con eso?` : "Estos clientes no tienen ventas.";
    lista=ks.map(k=>{ const c=clientesAgrupados(true).find(x=>x.k===k); return c?esc(c.nombre):k; });
    const quitarDeLista = ks.map(k=>async()=>{ const c=clientesAgrupados(true).find(x=>x.k===k); const p=(c&&c.perfil)||{};
      const {id:_id, ...resto}=p; await NEG.cli.doc(p.id||slugCliente(c?c.nombre:k)).set({...resto, nombre:(c?c.nombre:p.nombre)||k, eliminado:true, eliminadoEn:Date.now()}); });
    tareasConservar = quitarDeLista.map(f=>async()=>{ await f(); });
    tareas=[...vs.map(v=>()=>NEG.ven.doc(v.id).delete()), ...qs.map(c=>()=>NEG.cot.doc(c.id).delete()), ...ps.map(p=>()=>NEG.cli.doc(p.id).delete())];
  } else {
    const its=ids.map(k=>NEG.items.find(i=>i.id===k.slice(2))).filter(Boolean);
    titulo=`¿Eliminar ${its.length} ${its.length===1?"producto":"productos"}?`;
    detalle="Se borran del inventario con sus fotos. Las ventas que ya registraste de estos productos no se borran.";
    lista=its.map(i=>`${esc(i.nombre)} · quedan ${Math.max(0,quedan(i))}`);
    tareas=its.map(i=>async()=>{ await NEG.inv.doc(i.id).delete(); if(i.foto&&ASSETS) ASSETS.delete(i.foto).catch(()=>{}); });
  }
  abrirHoja(`<div class="form"><h2>${titulo}</h2>
    <p style="margin:0">${detalle}</p>
    <div class="rows">${lista.slice(0,6).map(t=>`<div class="abitem"><span>${t}</span></div>`).join("")}${lista.length>6?`<p class="note">y ${lista.length-6} más…</p>`:""}</div>
    ${conOpciones?`<div class="delopts" role="radiogroup" aria-label="Qué hacer con sus ventas">
      <label class="delopt"><input type="radio" name="delmodo" value="conservar" checked><span><b>Conservar sus ventas, abonos y devoluciones</b><small>Solo se quita de tu lista de clientes. Tus ganancias y reportes no cambian. Si le vuelves a vender, reaparece con su historial.</small></span></label>
      <label class="delopt peligro"><input type="radio" name="delmodo" value="todo"><span><b>Borrar también sus ventas, abonos y devoluciones</b><small>Se borra todo su historial y sus cotizaciones. Las piezas vuelven a tu inventario.</small></span></label>
    </div>`:""}
    <p class="note" style="margin:0">Antes de borrar, la app guarda un respaldo automático por si te arrepientes (Resumen → Respaldos).</p>
    <p class="hint" id="hint"></p>
    <div class="dosbtn"><button class="btn ghost" id="delno">Cancelar</button><button class="btn peligro" id="delsi">Sí, eliminar</button></div></div>`, ()=>{
    $("#delno").onclick=()=>sheet.close();
    $("#delsi").onclick=async()=>{ const b=$("#delsi"); b.disabled=true; $("#delno").disabled=true;
      try{ b.textContent="Guardando respaldo…"; await crearRespaldo("antes",true);
        if(conOpciones && (sheet.querySelector('input[name="delmodo"]:checked')||{}).value==="conservar") tareas=tareasConservar;
        let n=0; for(const t of tareas){ await t(); n++; b.textContent=`Eliminando ${n} de ${tareas.length}…`; }
        const m=ids.length, msg={ventas:m===1?"Venta eliminada":`${m} ventas eliminadas`, clientes:m===1?"Cliente eliminado":`${m} clientes eliminados`, inventario:m===1?"Producto eliminado":`${m} productos eliminados`}[tipo];
        sheet.close(); salirSeleccion(); avisar(msg);
      }catch(err){ b.disabled=false; $("#delno").disabled=false; b.textContent="Reintentar"; errorGuardar(err); } };
  });
}
// consejo la primera vez
setTimeout(()=>{ if(!leer("tipSel",false) && NEG.estado==="ok" && !(SEG.bloqueada&&tieneClave())){ guardar("tipSel",true); avisar("Consejo: mantén presionada una venta, cliente o producto para seleccionar varios"); } }, 6000);

view.addEventListener("click", e=>{
  if(e.target.closest("[data-nuevo-item]")) return formItem();
  if(e.target.closest("[data-nueva-venta]")) return formVenta();
  const i=e.target.closest("[data-item]"); if(i) return formItem(NEG.items.find(x=>x.id===i.dataset.item));
  const v=e.target.closest("[data-venta]"); if(v) return hojaVenta(v.dataset.venta);
  const pd=e.target.closest("[data-pedido]"); if(pd) return hojaPedido(pd.dataset.pedido);
  const vs=e.target.closest("[data-vseg]"); if(vs){ NEG.vseg=vs.dataset.vseg; return vistaNegocio(); }
  if(e.target.closest("[data-nueva-cot]")) return formCotizacion();
  const q=e.target.closest("[data-cot]"); if(q) return hojaCotizacion(q.dataset.cot);
  if(e.target.closest("[data-exportar]")) return exportarProductos();
  const rp=e.target.closest("[data-rep]"); if(rp) return verDocumento(rp.dataset.rep==="ganancias"?repGanancias():repInventario());
  const dc=e.target.closest("[data-demo-cargar]"); if(dc) return cargarDemo(dc);
  const db_=e.target.closest("#demodel"); if(db_){ if(db_.dataset.armed){ db_.disabled=true; return borrarDemo(); } db_.dataset.armed="1"; db_.textContent="Toca otra vez para borrar"; setTimeout(()=>{ if(db_.isConnected){ delete db_.dataset.armed; db_.textContent=db_.dataset.label; } },3000); return; }
  const c=e.target.closest("[data-cliente]"); if(c) return hojaCliente(c.dataset.cliente);
});

function pintarTodo(){
  const r = TITULOS[location.hash.slice(1)] ? location.hash.slice(1) : "ventas";
  if(NEG.sub!==r){ NEG.sub=r; NEG.q=""; $("#q").value=""; }
  document.querySelectorAll(".tab").forEach(a=>a.dataset.tab===r?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  $("#titulo").textContent = TITULOS[r];
  $("#searchBox").hidden = r==="resumen" || NEG.estado!=="ok";
  $("#q").placeholder = {inventario:"Buscar producto o proveedor", ventas:"Buscar cliente, producto o número", clientes:"Buscar cliente o teléfono"}[r]||"Buscar";
  vistaNegocio();
}
window.addEventListener("hashchange",()=>{ pintarTodo(); scrollTo(0,0); });
$("#lockBtn").onclick=bloquearAhora;
$("#q").addEventListener("input", e=>{ NEG.q=e.target.value.trim(); vistaNegocio(); });

const temaGuardado = leer("tema", null);
if(temaGuardado) document.documentElement.dataset.theme = temaGuardado;
$("#themeBtn").onclick = ()=>{
  const oscuro = document.documentElement.dataset.theme ? document.documentElement.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const nuevo = oscuro ? "light" : "dark";
  document.documentElement.dataset.theme = nuevo; guardar("tema",nuevo);
};
aplicarBloqueo();
pintarTodo();
iniciarNegocio();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js", {scope:"./"}).catch(()=>{}); }
</script>
